<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidStore - Invidious Library</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Custom scrollbar for dark theme */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #18181b; 
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f46; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #52525b; 
        }
        .animate-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="bg-black text-zinc-300 font-sans selection:bg-red-500/30">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
        import { 
            getAuth, 
            signInAnonymously, 
            onAuthStateChanged, 
            signInWithCustomToken 
        } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            query, 
            onSnapshot, 
            deleteDoc, 
            doc, 
            orderBy, 
            serverTimestamp 
        } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
        
        // Import Icons from esm.sh for browser usage
        import { 
            Trash2, Play, Plus, Link as LinkIcon, ExternalLink, X, Film, Search, AlertCircle, Settings 
        } from 'https://esm.sh/lucide-react@0.378.0';

        const React = window.React;
        const { useState, useEffect } = React;

        // --- Configuration Logic ---
        
        // Your personal config (Fallback for local usage)
        const userFirebaseConfig = {
            apiKey: "AIzaSyAR-ZpJ4QR4AytJyWdGo2VJvKZWL4tGM-s",
            authDomain: "vidstore-9e9c2.firebaseapp.com",
            projectId: "vidstore-9e9c2",
            storageBucket: "vidstore-9e9c2.firebasestorage.app",
            messagingSenderId: "382120986454",
            appId: "1:382120986454:web:401056193538bd6fd7b8f7",
            measurementId: "G-JV7LVE4Y2V"
        };

        // Environment Detection
        let firebaseConfig;
        let useEnvToken = false;
        let activeAppId = 'default-app-id';

        if (typeof window.__firebase_config !== 'undefined') {
            // We are in the AI Preview Environment
            console.log("Using Environment Config");
            firebaseConfig = JSON.parse(window.__firebase_config);
            useEnvToken = true;
            if (typeof window.__app_id !== 'undefined') activeAppId = window.__app_id;
        } else {
            // We are running locally/standalone
            console.log("Using User Config (Standalone Mode)");
            firebaseConfig = userFirebaseConfig;
            useEnvToken = false;
        }

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- Helper Functions ---

        const extractVideoId = (url) => {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        };

        const getInvidiousEmbedUrl = (videoId, time = 0) => {
            return `https://yewtu.be/embed/${videoId}?autoplay=1${time ? `&t=${time}` : ''}`;
        };

        const getThumbnailUrl = (videoId, quality = 'maxresdefault') => {
            return `https://i3.ytimg.com/vi/${videoId}/${quality}.jpg`;
        };

        // --- Components ---

        const VideoCard = ({ video, onDelete, onPlay }) => {
            const [imgSrc, setImgSrc] = useState(getThumbnailUrl(video.videoId, 'maxresdefault'));
            const [isHovered, setIsHovered] = useState(false);

            const handleError = () => {
                if (imgSrc.includes('maxresdefault')) {
                    setImgSrc(getThumbnailUrl(video.videoId, 'hqdefault'));
                }
            };

            return (
                <div 
                    className="group relative bg-zinc-900 rounded-xl overflow-hidden shadow-lg hover:shadow-2xl transition-all duration-300 border border-zinc-800 hover:border-red-500/30 flex flex-col"
                    onMouseEnter={() => setIsHovered(true)}
                    onMouseLeave={() => setIsHovered(false)}
                >
                    <div className="relative aspect-video cursor-pointer overflow-hidden" onClick={() => onPlay(video)}>
                        <img 
                            src={imgSrc} 
                            onError={handleError}
                            alt={video.title || "Video thumbnail"} 
                            className="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-500"
                        />
                        <div className={`absolute inset-0 bg-black/40 flex items-center justify-center transition-opacity duration-300 ${isHovered ? 'opacity-100' : 'opacity-0'}`}>
                            <div className="w-14 h-14 bg-red-600 rounded-full flex items-center justify-center shadow-lg transform group-hover:scale-110 transition-transform">
                                <Play className="w-6 h-6 text-white ml-1" fill="currentColor" />
                            </div>
                        </div>
                        <div className="absolute bottom-2 right-2 bg-black/80 px-2 py-1 rounded text-xs font-medium text-white">
                            Invidious
                        </div>
                    </div>

                    <div className="p-4 flex flex-col flex-grow">
                        <h3 className="font-semibold text-zinc-100 line-clamp-2 mb-2 flex-grow" title={video.title}>
                            {video.title || "Untitled Video"}
                        </h3>
                        
                        <div className="flex items-center justify-between mt-auto pt-3 border-t border-zinc-800">
                            <div className="flex items-center text-xs text-zinc-500">
                                <span>{video.createdAt?.seconds ? new Date(video.createdAt.seconds * 1000).toLocaleDateString() : 'Just now'}</span>
                            </div>
                            <div className="flex gap-2">
                                <button 
                                    onClick={(e) => { e.stopPropagation(); onDelete(video.id); }}
                                    className="p-2 text-zinc-400 hover:text-red-400 hover:bg-red-400/10 rounded-lg transition-colors"
                                    title="Delete video"
                                >
                                    <Trash2 size={16} />
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const AddVideoModal = ({ isOpen, onClose, onAdd }) => {
            const [url, setUrl] = useState('');
            const [title, setTitle] = useState('');
            const [error, setError] = useState('');
            const [previewId, setPreviewId] = useState(null);

            useEffect(() => {
                if (!isOpen) {
                    setUrl('');
                    setTitle('');
                    setError('');
                    setPreviewId(null);
                }
            }, [isOpen]);

            const handleUrlChange = (e) => {
                const input = e.target.value;
                setUrl(input);
                const id = extractVideoId(input);
                if (id) {
                    setPreviewId(id);
                    setError('');
                } else if (input.length > 0) {
                    setPreviewId(null);
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const id = extractVideoId(url);
                if (!id) {
                    setError('Invalid YouTube URL');
                    return;
                }
                onAdd({ videoId: id, title: title || 'Untitled Video', originalUrl: url });
                onClose();
            };

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4 animate-in">
                    <div className="bg-zinc-900 border border-zinc-700 w-full max-w-md rounded-2xl shadow-2xl overflow-hidden">
                        <div className="p-4 border-b border-zinc-800 flex justify-between items-center bg-zinc-950/50">
                            <h2 className="text-lg font-semibold text-white flex items-center gap-2">
                                <Plus className="text-red-500" /> Add New Video
                            </h2>
                            <button onClick={onClose} className="text-zinc-400 hover:text-white transition-colors">
                                <X size={20} />
                            </button>
                        </div>
                        
                        <form onSubmit={handleSubmit} className="p-6 space-y-4">
                            <div className="space-y-2">
                                <label className="text-xs font-medium text-zinc-400 uppercase tracking-wider">YouTube Link</label>
                                <div className="relative">
                                    <LinkIcon className="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500" size={18} />
                                    <input
                                        type="text"
                                        value={url}
                                        onChange={handleUrlChange}
                                        placeholder="https://youtu.be/..."
                                        className="w-full bg-zinc-950 border border-zinc-800 rounded-xl py-3 pl-10 pr-4 text-zinc-200 placeholder-zinc-600 focus:outline-none focus:ring-2 focus:ring-red-500/50 focus:border-red-500 transition-all"
                                        autoFocus
                                    />
                                </div>
                                {error && <p className="text-red-400 text-xs flex items-center gap-1"><AlertCircle size={12} /> {error}</p>}
                            </div>

                            <div className="space-y-2">
                                <label className="text-xs font-medium text-zinc-400 uppercase tracking-wider">Title (Optional)</label>
                                <input
                                    type="text"
                                    value={title}
                                    onChange={(e) => setTitle(e.target.value)}
                                    placeholder="Enter a custom title..."
                                    className="w-full bg-zinc-950 border border-zinc-800 rounded-xl py-3 px-4 text-zinc-200 placeholder-zinc-600 focus:outline-none focus:ring-2 focus:ring-red-500/50 focus:border-red-500 transition-all"
                                />
                            </div>

                            {previewId && (
                                <div className="bg-zinc-950/50 rounded-lg p-3 border border-zinc-800/50 flex gap-3 items-center">
                                    <img 
                                        src={getThumbnailUrl(previewId)} 
                                        alt="Preview" 
                                        className="w-20 h-12 object-cover rounded bg-zinc-800"
                                    />
                                    <div className="text-xs text-zinc-400">
                                        <p className="text-green-400 mb-1">✓ Valid ID: {previewId}</p>
                                        <p>Ready to embed via Yewtu.be</p>
                                    </div>
                                </div>
                            )}

                            <div className="pt-2">
                                <button
                                    type="submit"
                                    disabled={!previewId}
                                    className={`w-full py-3 rounded-xl font-medium transition-all ${
                                        previewId 
                                        ? 'bg-red-600 hover:bg-red-500 text-white shadow-lg shadow-red-900/20' 
                                        : 'bg-zinc-800 text-zinc-500 cursor-not-allowed'
                                    }`}
                                >
                                    Add to Library
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const VideoPlayer = ({ video, onClose }) => {
            if (!video) return null;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/90 p-4 animate-in">
                    <div className="w-full max-w-5xl bg-zinc-900 rounded-2xl overflow-hidden shadow-2xl border border-zinc-800 flex flex-col max-h-[90vh]">
                        <div className="p-4 border-b border-zinc-800 flex justify-between items-center bg-zinc-950">
                            <h2 className="text-lg font-semibold text-zinc-100 truncate pr-4">{video.title}</h2>
                            <div className="flex items-center gap-2">
                                <a 
                                    href={video.originalUrl} 
                                    target="_blank" 
                                    rel="noopener noreferrer"
                                    className="p-2 text-zinc-400 hover:text-white transition-colors"
                                    title="Open Original on YouTube"
                                >
                                    <ExternalLink size={20} />
                                </a>
                                <button 
                                    onClick={onClose}
                                    className="p-2 text-zinc-400 hover:text-red-400 hover:bg-red-400/10 rounded-lg transition-colors"
                                >
                                    <X size={24} />
                                </button>
                            </div>
                        </div>

                        <div className="relative w-full pb-[56.25%] bg-black">
                        <iframe
                            id="ivplayer"
                            className="absolute inset-0 w-full h-full"
                            src={getInvidiousEmbedUrl(video.videoId)}
                            style={{ border: 'none' }}
                            allowFullScreen
                            allow="autoplay; encrypted-media"
                            title="Invidious Player"
                        ></iframe>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Main App Component ---

        function App() {
            const [user, setUser] = useState(null);
            const [videos, setVideos] = useState([]);
            const [isAddModalOpen, setIsAddModalOpen] = useState(false);
            const [activeVideo, setActiveVideo] = useState(null);
            const [loading, setLoading] = useState(true);
            const [authError, setAuthError] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        setAuthError(null);
                        // Secure Token Auth (Env Only)
                        if (useEnvToken && typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) {
                            await signInWithCustomToken(auth, window.__initial_auth_token);
                        } else {
                            // Anonymous Auth (Standalone or Fallback)
                            await signInAnonymously(auth);
                        }
                    } catch (error) {
                        console.error("Auth failed:", error);
                        if (error.code === 'auth/admin-restricted-operation') {
                            setAuthError("Anonymous Authentication is disabled in your Firebase Console. Please enable it in Authentication > Sign-in method.");
                        } else {
                            setAuthError(error.message);
                        }
                        
                        // Retry fallback if it was a custom token issue
                        if (useEnvToken) {
                             try { await signInAnonymously(auth); setAuthError(null); } catch(e) { 
                                 // Keep the original error if fallback fails too
                                 console.error("Fallback auth failed", e)
                                 if (e.code === 'auth/admin-restricted-operation') {
                                    setAuthError("Anonymous Authentication is disabled. Go to Firebase Console > Authentication > Sign-in method > Enable Anonymous.");
                                 }
                             }
                        }
                    }
                };
                initAuth();
                
                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    if(u) setAuthError(null);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) {
                    if (authError) setLoading(false);
                    return;
                }

                const q = query(
                    collection(db, 'artifacts', activeAppId, 'users', user.uid, 'videos'),
                    orderBy('createdAt', 'desc')
                );

                const unsubscribe = onSnapshot(q, 
                    (snapshot) => {
                        const videoList = snapshot.docs.map(doc => ({
                            id: doc.id,
                            ...doc.data()
                        }));
                        setVideos(videoList);
                        setLoading(false);
                    },
                    (error) => {
                        console.error("Firestore error:", error);
                        setLoading(false);
                    }
                );

                return () => unsubscribe();
            }, [user, authError]);

            const handleAddVideo = async (videoData) => {
                if (!user) return;
                try {
                    await addDoc(collection(db, 'artifacts', activeAppId, 'users', user.uid, 'videos'), {
                        ...videoData,
                        createdAt: serverTimestamp()
                    });
                } catch (error) {
                    console.error("Error adding video:", error);
                }
            };

            const handleDeleteVideo = async (docId) => {
                if (!user) return;
                if (window.confirm('Remove this video from your library?')) {
                    try {
                        await deleteDoc(doc(db, 'artifacts', activeAppId, 'users', user.uid, 'videos', docId));
                    } catch (error) {
                        console.error("Error deleting video:", error);
                    }
                }
            };

            const filteredVideos = videos.filter(v => 
                v.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                v.videoId.toLowerCase().includes(searchQuery.toLowerCase())
            );

            // --- Render: Auth Error State ---
            if (authError) {
                return (
                    <div className="min-h-screen bg-black text-zinc-300 font-sans flex items-center justify-center p-4">
                        <div className="bg-zinc-900 border border-red-500/50 rounded-2xl p-8 max-w-md w-full text-center shadow-2xl shadow-red-900/20">
                            <div className="bg-red-500/10 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-6">
                                <Settings className="text-red-500" size={32} />
                            </div>
                            <h2 className="text-xl font-bold text-white mb-2">Configuration Required</h2>
                            <p className="text-zinc-400 mb-6 text-sm leading-relaxed">
                                {authError}
                            </p>
                            <div className="bg-black/50 rounded-lg p-4 text-left text-xs text-zinc-500 font-mono mb-6">
                                Error Code: auth/admin-restricted-operation
                            </div>
                            <a 
                                href="https://console.firebase.google.com/" 
                                target="_blank"
                                className="inline-flex items-center gap-2 bg-red-600 hover:bg-red-500 text-white px-6 py-3 rounded-xl font-medium transition-colors"
                            >
                                Open Firebase Console <ExternalLink size={16} />
                            </a>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen">
                    {/* Navigation Bar */}
                    <nav className="sticky top-0 z-40 bg-black/80 backdrop-blur-md border-b border-zinc-800">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex items-center justify-between h-16">
                                <div className="flex items-center gap-3">
                                    <div className="bg-gradient-to-br from-red-600 to-red-800 text-white p-2 rounded-lg shadow-lg shadow-red-900/20">
                                        <Film size={20} />
                                    </div>
                                    <span className="font-bold text-xl text-white tracking-tight">VidStore</span>
                                </div>

                                <div className="flex-1 max-w-md mx-4 hidden sm:block">
                                    <div className="relative">
                                        <Search className="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500" size={16} />
                                        <input 
                                            type="text"
                                            placeholder="Search library..."
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                            className="w-full bg-zinc-900 border border-zinc-800 rounded-full py-2 pl-10 pr-4 text-sm focus:outline-none focus:ring-1 focus:ring-red-500/50 transition-all text-zinc-200"
                                        />
                                    </div>
                                </div>

                                <button
                                    onClick={() => setIsAddModalOpen(true)}
                                    className="flex items-center gap-2 bg-white text-black px-4 py-2 rounded-full font-medium hover:bg-zinc-200 transition-colors shadow-lg shadow-white/5 active:scale-95"
                                >
                                    <Plus size={18} />
                                    <span className="hidden sm:inline">Add Video</span>
                                </button>
                            </div>
                        </div>
                    </nav>

                    {/* Main Content */}
                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {!user || loading ? (
                            <div className="flex flex-col items-center justify-center py-20">
                                <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-red-500 mb-4"></div>
                                <p className="text-zinc-500">Loading library...</p>
                            </div>
                        ) : filteredVideos.length > 0 ? (
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                                {filteredVideos.map(video => (
                                    <VideoCard 
                                        key={video.id} 
                                        video={video} 
                                        onDelete={handleDeleteVideo} 
                                        onPlay={setActiveVideo}
                                    />
                                ))}
                            </div>
                        ) : (
                            <div className="flex flex-col items-center justify-center py-20 text-center border border-dashed border-zinc-800 rounded-2xl bg-zinc-900/30">
                                <div className="bg-zinc-800/50 p-4 rounded-full mb-4">
                                    <Film size={40} className="text-zinc-600" />
                                </div>
                                <h3 className="text-xl font-medium text-white mb-2">Your library is empty</h3>
                                <p className="text-zinc-500 max-w-sm mb-6">
                                    Start building your collection by adding YouTube videos. We'll store them safely using Invidious for playback.
                                </p>
                                <button
                                    onClick={() => setIsAddModalOpen(true)}
                                    className="text-red-400 hover:text-red-300 font-medium flex items-center gap-2"
                                >
                                    Add your first video <ExternalLink size={14} />
                                </button>
                            </div>
                        )}
                    </main>

                    {/* Modals */}
                    <AddVideoModal 
                        isOpen={isAddModalOpen} 
                        onClose={() => setIsAddModalOpen(false)} 
                        onAdd={handleAddVideo} 
                    />
                    
                    {activeVideo && (
                        <VideoPlayer 
                            video={activeVideo} 
                            onClose={() => setActiveVideo(null)} 
                        />
                    )}

                    {/* Mobile Search */}
                    <div className="sm:hidden fixed bottom-0 left-0 right-0 bg-zinc-900 border-t border-zinc-800 p-4">
                        <div className="relative">
                            <Search className="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500" size={16} />
                            <input 
                                type="text"
                                placeholder="Search..."
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                className="w-full bg-zinc-950 border border-zinc-800 rounded-lg py-3 pl-10 pr-4 text-sm focus:outline-none focus:ring-1 focus:ring-red-500/50 text-zinc-200"
                            />
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
